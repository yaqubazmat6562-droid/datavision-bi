<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DATAVISION BI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300b4d8'/><text x='50' y='68' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>DV</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">DV</span>
            <h1>Create Account</h1>
            <p>Start your data journey with DATAVISION BI</p>
        </div>

        <form id="signupForm" class="auth-form">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Company (optional)</label>
                <input type="text" id="company" placeholder="Your Company">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Country</label>
                    <select id="country">
                        <option value="IN">India</option>
                        <option value="US">United States</option>
                        <option value="GB">United Kingdom</option>
                        <option value="PK">Pakistan</option>
                        <option value="AE">UAE</option>
                        <option value="SA">Saudi Arabia</option>
                        <option value="MY">Malaysia</option>
                        <option value="SG">Singapore</option>
                        <option value="AU">Australia</option>
                        <option value="CA">Canada</option>
                        <option value="DE">Germany</option>
                        <option value="FR">France</option>
                        <option value="JP">Japan</option>
                        <option value="CN">China</option>
                        <option value="BD">Bangladesh</option>
                        <option value="NP">Nepal</option>
                        <option value="LK">Sri Lanka</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Currency</label>
                    <select id="currency">
                        <option value="INR">₹ INR</option>
                        <option value="USD">$ USD</option>
                        <option value="EUR">€ EUR</option>
                        <option value="GBP">£ GBP</option>
                        <option value="PKR">₨ PKR</option>
                        <option value="AED">د.إ AED</option>
                        <option value="SAR">﷼ SAR</option>
                        <option value="MYR">RM MYR</option>
                        <option value="SGD">S$ SGD</option>
                        <option value="AUD">A$ AUD</option>
                        <option value="CAD">C$ CAD</option>
                        <option value="JPY">¥ JPY</option>
                        <option value="CNY">¥ CNY</option>
                        <option value="BDT">৳ BDT</option>
                        <option value="NPR">₨ NPR</option>
                        <option value="LKR">Rs LKR</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="Min 8 chars, 1 letter, 1 number" required>
                <div class="password-hint">Must be at least 8 characters with letters and numbers</div>
            </div>

            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password" required>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    <span>I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a></span>
                </label>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <button type="submit" class="auth-btn primary" id="signupBtn">
                Create Account
            </button>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
        e.preventDefault();
        AuthModule.signup();
    });
</script>

</body>
</html>
