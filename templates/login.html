<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DATAVISION BI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300b4d8'/><text x='50' y='68' font-size='60' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'>DV</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="logo-icon">DV</span>
            <h1>Welcome Back</h1>
            <p>Sign in to your DATAVISION BI account</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Your password" required>
            </div>

            <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember">
                    <span>Remember me</span>
                </label>
                <a href="/forgot-password" class="forgot-link">Forgot password?</a>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <button type="submit" class="auth-btn primary" id="loginBtn">
                Sign In
            </button>

            <div class="auth-footer">
                Don't have an account? <a href="/signup">Create one</a>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        AuthModule.login();
    });
</script>

</body>
</html>
